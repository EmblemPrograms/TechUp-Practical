<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DOM & Selectors Practice</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 600px;
        margin: 2rem auto;
        padding: 1rem;
        line-height: 1.6;
      }

      .card {
        background: #f0f4f8;
        border: 2px solid #1a73e8;
        padding: 1rem;
        margin: 1rem 0;
        border-radius: 8px;
      }

      .highlight {
        background-color: #ead07a;
        border-color: #3f3002;
      }

      button {
        padding: 0.6rem 1.2rem;
        margin: 0.3rem;
        cursor: pointer;
        border-radius: 6px;
        border: none;
        background: #1a73e8;
        color: white;
        font-weight: 600;
      }

      button:hover {
        background: #0d47a1;
      }
    </style>
  </head>

  <body>
    <h1 id="main-title">DOM Practice Page</h1>
    <div class="card" id="info-card">
      <p>This is the original card content.</p>
    </div>
    <button id="change-text">Change Text</button>
    <button id="toggle-style">Toggle Highlight</button>
    <button id="add-item">Add New Item</button>
    <button id="remove-item">Remove Last Item</button>
    <div id="list-container"></div>
    <script>
      // 1. Select elements
      const title = document.getElementById("main-title");
      const card = document.querySelector("#info-card");
      const changeBtn = document.querySelector("#change-text");
      const toggleBtn = document.querySelector("#toggle-style");
      const addBtn = document.querySelector("#add-item");
      const removeBtn = document.querySelector("#remove-item");
      const listContainer = document.querySelector("#list-container");
      // 2. Change content
      changeBtn.addEventListener("click", function () {
        title.textContent = "Class 22!";
        card.querySelector("p").textContent =
          "The topic that will be done today is Events and Listeners.";
      });
      // 3. Toggle class
      toggleBtn.addEventListener("click", function () {
        card.classList.toggle("highlight");
      });
      // 4. Create new elements
      let counter = 1;
      addBtn.addEventListener("click", function () {
        const newItem = document.createElement("div");
        newItem.classList.add("card");
        newItem.textContent = "New item number " + counter;
        listContainer.appendChild(newItem);
        counter++;
      });
      // 5. Remove elements
      removeBtn.addEventListener("click", function () {
        const items = listContainer.querySelectorAll(".card");
        if (items.length > 0) {
          items[items.length - 1].remove();
        }
      });
    </script>
  </body>
</html>
