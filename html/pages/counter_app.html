<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Counter App – Events & Listeners</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #f0f4f8;
    }
    h1 {
      font-size: 4rem;
      margin-bottom: 1.5rem;
      color: #1a73e8;
    }
    .buttons {
      display: flex;
      gap: 1rem;
    }
    button {
      padding: 0.8rem 1.6rem;
      font-size: 1.2rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: transform 0.15s ease;
    }
    button:hover {
      transform: scale(1.05);
    }
    #decrease { background: #ef5350; color: white; }
    #reset    { background: #78909c; color: white; }
    #increase { background: #66bb6a; color: white; }
  </style>
</head>
<body>
  <h1 id="count">0</h1>

  <div class="buttons">
    <button id="decrease">−</button>
    <button id="reset">Reset</button>
    <button id="increase">+</button>
  </div>

  <script>
    // 1. Select elements
    const countDisplay = document.getElementById("count");
    const decreaseBtn = document.getElementById("decrease");
    const resetBtn = document.getElementById("reset");
    const increaseBtn = document.getElementById("increase");

    // 2. State variable
    let count = 0;

    // 3. Update function
    function updateDisplay() {
      countDisplay.textContent = count;

      // Optional: change color based on value
      if (count > 0) {
        countDisplay.style.color = "#66bb6a";
      } else if (count < 0) {
        countDisplay.style.color = "#ef5350";
      } else {
        countDisplay.style.color = "#1a73e8";
      }
    }

    // 4. Event listeners
    increaseBtn.addEventListener("click", function() {
      count++;
      updateDisplay();
    });

    decreaseBtn.addEventListener("click", function() {
      count--;
      updateDisplay();
    });

    resetBtn.addEventListener("click", function() {
      count = 0;
      updateDisplay();
    });
  </script>
</body>
</html>
