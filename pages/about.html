<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript DOM</title>
    <!-- <script src="../js/about.js"></script> -->
</head>

<body>
    <div id="main" class="box">
        <h1 id="title">This is an about</h1>
        <h2 class="subtitle">Welcome to the Third class of the week</h2>

        <p>Welcome to TechUp Academy</p>
        <p>This is the first cohort</p>
        <p id="demo">

        </p>
    </div>


    <button id="add-item">Add new Item</button>
    <div id="list-container"></div>

    <div class="card"></div>
    <div class="card"></div>
    <div class="card"></div>
    <div class="card"></div>


    <script>
        const addBtn = document.querySelector("#add-item")
        const listContainer = document.querySelector("#list-container")

        let counter = 1
        addBtn.addEventListener("click", function () {
             const newItem = document.createElement("div")
             const Sname = "Student name"
            newItem.classList.add("card")
            newItem.textContent = counter  + Sname  + ":" + " Hikmat"
            listContainer.appendChild(newItem);
            counter++
})
        const box = document.querySelector(".box");

        box.style.backgroundColor = "lightblue"
        box.style.padding = "20px"
        box.style.borderRadius = "20px"


        // const subtitle = document.querySelector("subtitle")

        // subtitle.classList.remove("hidden")




        const title = document.getElementById("title");
        const demo = document.getElementById('demo');

        title.textContent = "This is Week 7 Class 2";
        demo.innerText = Date();

        const cards = document.getElementsByClassName("card");

        Array.from(cards).forEach((card) => {
            card.innerHTML = "<b>This is a preview card</b>"
        })

        



        // // Change the content of the Element
        // myPara.innerHTML = "Hello World!";

        // const myPara = document.querySelectorAll(".card");
        // // Change the content of the Element
        // myPara[0].innerHTML = "Hello World!";
        // // myPara[1].innerHTML = "Hello World!";
        // myPara[2].innerHTML = "Hello World!";
        // myPara[3].innerHTML = "Hello World!";

        const container = document.getElementById("main");
        const seed = container.getElementsByTagName("p");

        seed.innerHTML = "This is a Paragraph"

        document.getElementById("demo").innerHTML = seed[0].innerHTML + "<br>" + seed[1].innerHTML;

    </script>
</body>
